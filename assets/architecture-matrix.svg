  <line x1="420" y1="116" x2="420" y2="128" stroke="#C084FC" stroke-width="1.8" class="data-stream"/>
  <line x1="576" y1="116" x2="576" y2="128" stroke="#F472B6" stroke-width="1.8" class="data-stream"/>
  <line x1="732" y1="116" x2="732" y2="128" stroke="#F59E0B" stroke-width="1.8" class="data-stream"/>
