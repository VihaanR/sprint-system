<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="550">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10"/>
      <stop offset="50%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Gate Glow Shimmer -->
    <linearGradient id="gateGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#FB7185" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="matrixGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.25"/>
    </pattern>

    <!-- Phase Accents -->
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#38BDF8"/><stop offset="100%" stop-color="#0284C7"/></linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#818CF8"/><stop offset="100%" stop-color="#4F46E5"/></linearGradient>
    <linearGradient id="accent3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#C084FC"/><stop offset="100%" stop-color="#9333EA"/></linearGradient>
    <linearGradient id="accent4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#F472B6"/><stop offset="100%" stop-color="#DB2777"/></linearGradient>
    <linearGradient id="accent5" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/></linearGradient>
    <linearGradient id="accent6" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#10B981"/><stop offset="100%" stop-color="#059669"/></linearGradient>

    <style>
      @keyframes gate-pulse {
        0%, 100% { stroke-opacity: 0.8; }
        50% { stroke-opacity: 0.3; }
      }
      @keyframes stream-down {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -20; }
      }
      @keyframes beacon-ping {
        0% { r: 4px; opacity: 1; }
        100% { r: 12px; opacity: 0; }
      }

      .gate-box { animation: gate-pulse 3s ease-in-out infinite; }
      .data-stream { stroke-dasharray: 4 4; animation: stream-down 1.2s linear infinite; }
      .beacon { animation: beacon-ping 2s cubic-bezier(0, 0, 0.2, 1) infinite; }

      .hdr-title { font-family: 'Inter', -apple-system, sans-serif; font-weight: 900; font-size: 22px; fill: #F8FAFC; letter-spacing: -0.02em; }
      .hdr-sub { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-size: 11px; fill: #94A3B8; }
      .gate-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #F43F5E; letter-spacing: 0.05em; }
      .gate-sub { font-family: 'Inter', sans-serif; font-size: 10px; fill: #CBD5E1; }
      .col-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; fill: #F8FAFC; }
      .col-time { font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 600; }
      .item-lbl { font-family: 'JetBrains Mono', monospace; font-size: 8.5px; font-weight: 700; fill: #64748B; letter-spacing: 0.04em; }
      .item-val { font-family: 'Inter', sans-serif; font-size: 9.5px; fill: #CBD5E1; line-height: 1.35; }
      .proto-title { font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 700; fill: #38BDF8; letter-spacing: 0.05em; }
      .proto-val { font-family: 'Inter', sans-serif; font-size: 9px; fill: #94A3B8; }
      .doodle-text { font-family: 'Comic Sans MS', cursive, sans-serif; font-size: 9px; fill: #F59E0B; }
    </style>
