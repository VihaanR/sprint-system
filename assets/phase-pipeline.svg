<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 210" width="100%" height="210">
  <defs>
    <style>
      /* Non-linear Easing and 12 Principles of Animation */
      @keyframes dash-stream {
        to { stroke-dashoffset: -36; }
      }
      @keyframes gate-wiggle {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-3px) rotate(0.4deg); }
      }
      @keyframes runner-traverse {
        0% { transform: translateX(50px); }
        16.6% { transform: translateX(210px); }
        33.3% { transform: translateX(380px); }
        50% { transform: translateX(550px); }
        66.6% { transform: translateX(710px); }
        83.3% { transform: translateX(860px); }
        100% { transform: translateX(920px); }
      }
      @keyframes runner-squash {
        0%, 100% { transform: scale(1.05, 0.95); }
        50% { transform: scale(0.95, 1.05) translateY(-5px); }
      }

      .flow-stream {
        stroke-dasharray: 8 6;
        animation: dash-stream 1.6s linear infinite;
      }
      .gate-card {
        animation: gate-wiggle 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        transform-origin: center;
      }
      .pipeline-runner {
        animation: runner-traverse 14s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      .runner-bob {
        animation: runner-squash 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
        transform-origin: bottom center;
      }

      .mono-code {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-weight: 700;
      }
      .comic-hand {
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Bradley Hand', cursive, sans-serif;
        font-weight: 700;
      }
      .ink-heavy {
        stroke: #18181B;
        stroke-width: 2.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .ink-med {
        stroke: #18181B;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>

    <!-- Realistic Paper Drop Shadow -->
    <filter id="pipeline-shadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- Card Shadow Filter -->
    <filter id="gate-card-shadow" x="-6%" y="-6%" width="116%" height="116%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>

    <!-- Notebook Ruling Pattern -->
    <pattern id="pipe-ruling" width="80" height="22" patternUnits="userSpaceOnUse">
      <line x1="0" y1="22" x2="80" y2="22" stroke="#DBEAFE" stroke-width="1" opacity="0.75"/>
    </pattern>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. FLOATING NOTEBOOK CANVAS WITH DESK SHADOW             -->
  <!-- ======================================================== -->
  <rect x="16" y="14" width="968" height="182" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#pipeline-shadow)"/>
  <rect x="16" y="14" width="968" height="182" rx="16" fill="#FCFBF7" opacity="0.75"/>

  <!-- Top Spiral Binder Wire Loops -->
  <g transform="translate(48, 10)">
    <g fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.2">
      <rect x="20" y="6" width="12" height="6" rx="3"/>
      <rect x="120" y="6" width="12" height="6" rx="3"/>
      <rect x="220" y="6" width="12" height="6" rx="3"/>
      <rect x="320" y="6" width="12" height="6" rx="3"/>
      <rect x="420" y="6" width="12" height="6" rx="3"/>
      <rect x="520" y="6" width="12" height="6" rx="3"/>
      <rect x="620" y="6" width="12" height="6" rx="3"/>
      <rect x="720" y="6" width="12" height="6" rx="3"/>
      <rect x="820" y="6" width="12" height="6" rx="3"/>
    </g>
    <g stroke="#64748B" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M 23 3 C 23 -3, 29 -3, 29 3 L 29 9"/>
      <path d="M 123 3 C 123 -3, 129 -3, 129 3 L 129 9"/>
      <path d="M 223 3 C 223 -3, 229 -3, 229 3 L 229 9"/>
      <path d="M 323 3 C 323 -3, 329 -3, 329 3 L 329 9"/>
      <path d="M 423 3 C 423 -3, 429 -3, 429 3 L 429 9"/>
      <path d="M 523 3 C 523 -3, 529 -3, 529 3 L 529 9"/>
      <path d="M 623 3 C 623 -3, 629 -3, 629 3 L 629 9"/>
      <path d="M 723 3 C 723 -3, 729 -3, 729 3 L 729 9"/>
      <path d="M 823 3 C 823 -3, 829 -3, 829 3 L 829 9"/>
    </g>
  </g>

  <!-- Blue Ruled Lines -->
  <rect x="18" y="36" width="964" height="156" fill="url(#pipe-ruling)"/>

  <!-- Red Margin Line -->
  <line x1="48" y1="16" x2="48" y2="194" stroke="#EF4444" stroke-width="1.8" opacity="0.75"/>

  <!-- Top Title Bar Banner -->
  <g transform="translate(60, 24)">
    <rect x="0" y="0" width="280" height="22" rx="3" fill="#FEF08A" stroke="#18181B" stroke-width="2" filter="url(#gate-card-shadow)"/>
    <text x="12" y="15" class="mono-code" font-size="10" fill="#18181B">[THE 5-HOUR SPRINT ROADMAP : 6 GATES]</text>
  </g>
  <text x="750" y="38" class="comic-hand" font-size="11.5" fill="#DC2626">"NO FLUFF • SHIP AT HOUR 5"</text>

  <!-- ======================================================== -->
  <!-- 2. HAND-DRAWN CONNECTING BACKBONE & ANIMATED STREAM      -->
  <!-- ======================================================== -->
  <path d="M 60 120 C 160 116, 220 122, 320 118 C 420 114, 500 122, 600 118 C 700 114, 800 122, 940 118" stroke="#CBD5E1" stroke-width="4.5" fill="none" stroke-linecap="round"/>
  <path d="M 60 120 C 160 116, 220 122, 320 118 C 420 114, 500 122, 600 118 C 700 114, 800 122, 940 118" stroke="#0284C7" stroke-width="2.5" class="flow-stream" fill="none" stroke-linecap="round"/>

  <!-- ======================================================== -->
  <!-- 3. MINI WIMPY KID RUNNER TRAVERSING THE PIPELINE         -->
  <!-- ======================================================== -->
  <g class="pipeline-runner" transform="translate(0, 0)">
    <g class="runner-bob" transform="translate(0, 94)">
      <ellipse cx="0" cy="24" rx="10" ry="2.2" fill="#18181B" opacity="0.3"/>
      <!-- Trailing leg -->
      <path d="M -2 12 L -7 20 L -11 20" stroke="#18181B" stroke-width="2.2" fill="none"/>
      <!-- Driving front leg -->
      <path d="M 2 12 L 6 18 L 10 22" stroke="#18181B" stroke-width="2.2" fill="none"/>
      <!-- Torso with black shorts -->
      <path d="M 0 3 L -1 10" stroke="#18181B" stroke-width="3"/>
      <rect x="-3" y="10" width="5" height="4" fill="#18181B"/>
      <!-- Pumping arms -->
      <path d="M -1 5 L -6 9 L -9 6" stroke="#18181B" stroke-width="2" fill="none"/>
      <path d="M 0 5 L 6 7 L 8 4" stroke="#18181B" stroke-width="2" fill="none"/>
      <!-- Round Head with 3 hairs & nose -->
      <circle cx="2" cy="-4" r="6.5" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
      <path d="M 0 -10 L 0 -13 M 3 -10 L 4 -14 M 6 -9 L 8 -13" stroke="#18181B" stroke-width="1.8"/>
      <path d="M 8 -4 C 11 -4, 11 0, 7 0" stroke="#18181B" stroke-width="1.8" fill="#FFFFFF"/>
      <circle cx="5" cy="-5" r="1.2" fill="#18181B"/>
      <path d="M -6 -7 Q -9 -7, -7 -4 Z" fill="#0284C7"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 4. THE 6 SPRINT GATES (HAND-DRAWN NOTEBOOK CARDS)        -->
  <!-- ======================================================== -->

  <!-- GATE 1: DISCOVER -->
  <g class="gate-card" transform="translate(60, 68)">
    <rect x="0" y="0" width="136" height="96" rx="6" fill="#F0F9FF" stroke="#18181B" stroke-width="2.2" filter="url(#gate-card-shadow)"/>
    <rect x="0" y="0" width="136" height="7" rx="2" fill="#0284C7"/>
    <text x="10" y="24" class="mono-code" font-size="11" fill="#0369A1">01. DISCOVER</text>
    <text x="10" y="38" class="mono-code" font-size="9" fill="#64748B">[EST: 60 min]</text>
    <line x1="8" y1="46" x2="128" y2="46" stroke="#BAE6FD" stroke-width="1"/>
    <text x="10" y="62" class="comic-hand" font-size="9.5" fill="#18181B">• &gt;= 15 Deep Qs</text>
    <text x="10" y="76" class="comic-hand" font-size="9.5" fill="#18181B">• Stitch &amp; ERD Tree</text>
    <text x="10" y="90" class="mono-code" font-size="8" fill="#0284C7">&gt; docs/SPEC.md</text>
  </g>

  <!-- GATE 2: BACKEND -->
  <g class="gate-card" transform="translate(212, 68)" style="animation-delay: 0.2s;">
    <rect x="0" y="0" width="136" height="96" rx="6" fill="#F5F3FF" stroke="#18181B" stroke-width="2.2" filter="url(#gate-card-shadow)"/>
    <rect x="0" y="0" width="136" height="7" rx="2" fill="#7C3AED"/>
    <text x="10" y="24" class="mono-code" font-size="11" fill="#6D28D9">02. BACKEND</text>
    <text x="10" y="38" class="mono-code" font-size="9" fill="#64748B">[EST: 60 min]</text>
    <line x1="8" y1="46" x2="128" y2="46" stroke="#DDD6FE" stroke-width="1"/>
    <text x="10" y="62" class="comic-hand" font-size="9.5" fill="#18181B">• FastAPI + Pydantic</text>
    <text x="10" y="76" class="comic-hand" font-size="9.5" fill="#18181B">• Gemini &amp; SQLite</text>
    <text x="10" y="90" class="mono-code" font-size="8" fill="#7C3AED">&gt; Pytest Exit 0</text>
  </g>

  <!-- GATE 3: FRONTEND -->
  <g class="gate-card" transform="translate(364, 68)" style="animation-delay: 0.4s;">
    <rect x="0" y="0" width="136" height="96" rx="6" fill="#FDF2F8" stroke="#18181B" stroke-width="2.2" filter="url(#gate-card-shadow)"/>
    <rect x="0" y="0" width="136" height="7" rx="2" fill="#DB2777"/>
    <text x="10" y="24" class="mono-code" font-size="11" fill="#BE185D">03. FRONTEND</text>
    <text x="10" y="38" class="mono-code" font-size="9" fill="#64748B">[EST: 60 min]</text>
    <line x1="8" y1="46" x2="128" y2="46" stroke="#FBCFE8" stroke-width="1"/>
    <text x="10" y="62" class="comic-hand" font-size="9.5" fill="#18181B">• Live Swarm Coding</text>
    <text x="10" y="76" class="comic-hand" font-size="9.5" fill="#18181B">• Antigravity Design</text>
    <text x="10" y="90" class="mono-code" font-size="8" fill="#DB2777">&gt; 0 Console Errs</text>
  </g>

  <!-- GATE 4: POLISH -->
  <g class="gate-card" transform="translate(516, 68)" style="animation-delay: 0.6s;">
    <rect x="0" y="0" width="136" height="96" rx="6" fill="#FFFBEB" stroke="#18181B" stroke-width="2.2" filter="url(#gate-card-shadow)"/>
    <rect x="0" y="0" width="136" height="7" rx="2" fill="#D97706"/>
    <text x="10" y="24" class="mono-code" font-size="11" fill="#B45309">04. POLISH</text>
    <text x="10" y="38" class="mono-code" font-size="9" fill="#64748B">[EST: 45 min]</text>
    <line x1="8" y1="46" x2="128" y2="46" stroke="#FDE68A" stroke-width="1"/>
    <text x="10" y="62" class="comic-hand" font-size="9.5" fill="#18181B">• Anti-Slop (Impeccable)</text>
    <text x="10" y="76" class="comic-hand" font-size="9.5" fill="#18181B">• Motion-Graphics Laws</text>
    <text x="10" y="90" class="mono-code" font-size="8" fill="#D97706">&gt; OLED Bento UI</text>
  </g>

  <!-- GATE 5: AUDIT -->
  <g class="gate-card" transform="translate(668, 68)" style="animation-delay: 0.8s;">
    <rect x="0" y="0" width="136" height="96" rx="6" fill="#FEF2F2" stroke="#18181B" stroke-width="2.2" filter="url(#gate-card-shadow)"/>
    <rect x="0" y="0" width="136" height="7" rx="2" fill="#DC2626"/>
    <text x="10" y="24" class="mono-code" font-size="11" fill="#B91C1C">05. AUDIT</text>
    <text x="10" y="38" class="mono-code" font-size="9" fill="#64748B">[EST: 45 min]</text>
    <line x1="8" y1="46" x2="128" y2="46" stroke="#FECACA" stroke-width="1"/>
    <text x="10" y="62" class="comic-hand" font-size="9.5" fill="#18181B">• Gravitas Evidence</text>
    <text x="10" y="76" class="comic-hand" font-size="9.5" fill="#18181B">• AAS Elite &amp; Ponytail</text>
    <text x="10" y="90" class="mono-code" font-size="8" fill="#DC2626">&gt; Negative LOC</text>
  </g>

  <!-- GATE 6: LAUNCH -->
  <g class="gate-card" transform="translate(820, 68)" style="animation-delay: 1.0s;">
    <rect x="0" y="0" width="144" height="96" rx="6" fill="#ECFDF5" stroke="#18181B" stroke-width="2.2" filter="url(#gate-card-shadow)"/>
    <rect x="0" y="0" width="144" height="7" rx="2" fill="#059669"/>
    <text x="10" y="24" class="mono-code" font-size="11" fill="#047857">06. LAUNCH</text>
    <text x="10" y="38" class="mono-code" font-size="9" fill="#64748B">[EST: 30 min]</text>
    <line x1="8" y1="46" x2="136" y2="46" stroke="#A7F3D0" stroke-width="1"/>
    <text x="10" y="62" class="comic-hand" font-size="9.5" fill="#18181B">• 60s Video (Remotion)</text>
    <text x="10" y="76" class="comic-hand" font-size="9.5" fill="#18181B">• Live URL &amp; Pitch Pack</text>
    <text x="10" y="90" class="mono-code" font-size="8" fill="#059669">&gt; Production URL</text>
  </g>

</svg>
