<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 170" width="100%" height="170">
  <defs>
    <style>
      /* Non-linear Easing and 12 Principles of Animation */
      @keyframes dash-stream {
        to { stroke-dashoffset: -36; }
      }
      @keyframes gate-wiggle {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-3px) rotate(0.4deg); }
      }
      @keyframes runner-traverse {
        0% { transform: translateX(50px); }
        16.6% { transform: translateX(210px); }
        33.3% { transform: translateX(380px); }
        50% { transform: translateX(550px); }
        66.6% { transform: translateX(710px); }
        83.3% { transform: translateX(870px); }
        100% { transform: translateX(920px); }
      }
      @keyframes runner-squash {
        0%, 100% { transform: scale(1.05, 0.95); }
        50% { transform: scale(0.95, 1.05) translateY(-4px); }
      }
      @keyframes pencil-pulse {
        0%, 100% { stroke-width: 2.5; opacity: 0.9; }
        50% { stroke-width: 3.5; opacity: 1; }
      }

      .flow-stream {
        stroke-dasharray: 8 6;
        animation: dash-stream 1.6s linear infinite;
      }
      .gate-card {
        animation: gate-wiggle 3s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        transform-origin: center;
      }
      .pipeline-runner {
        animation: runner-traverse 14s cubic-bezier(0.25, 1, 0.5, 1) infinite;
      }
      .runner-bob {
        animation: runner-squash 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
        transform-origin: bottom center;
      }

      .mono-code {
        font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
        font-weight: 700;
      }
      .comic-hand {
        font-family: 'Comic Sans MS', 'Chalkboard SE', 'Bradley Hand', cursive, sans-serif;
        font-weight: 700;
      }
      .pencil-line {
        stroke: #18181B;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .pencil-fine {
        stroke: #27272A;
        stroke-width: 1.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
    </style>

    <!-- Notebook Ruling Pattern -->
    <pattern id="pipe-ruling" width="80" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="80" y2="20" stroke="#BFDBFE" stroke-width="1" opacity="0.75"/>
    </pattern>

    <!-- Card Shadow Filter -->
    <filter id="box-shadow" x="-6%" y="-6%" width="115%" height="115%">
      <feDropShadow dx="2" dy="3" stdDeviation="2.5" flood-color="#0F172A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- ======================================================== -->
  <!-- 1. WHITE LINED NOTEBOOK CANVAS                           -->
  <!-- ======================================================== -->
  <rect x="2" y="2" width="996" height="166" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#box-shadow)"/>
  <rect x="2" y="2" width="996" height="166" rx="14" fill="#FCFBF7" opacity="0.6"/>
  <rect x="2" y="10" width="996" height="152" fill="url(#pipe-ruling)"/>

  <!-- Red Margin Line -->
  <line x1="42" y1="2" x2="42" y2="168" stroke="#EF4444" stroke-width="1.8" opacity="0.7"/>

  <!-- Top Title Bar Doodle -->
  <g transform="translate(56, 12)">
    <rect x="0" y="0" width="265" height="22" rx="3" fill="#FEF08A" stroke="#18181B" stroke-width="2" filter="url(#box-shadow)"/>
    <text x="12" y="15" class="mono-code" font-size="9.5" fill="#18181B">[THE 5-HOUR SPRINT ROADMAP : 6 GATES]</text>
  </g>
  <text x="780" y="26" class="comic-hand" font-size="11" fill="#DC2626">"NO FLUFF • SHIP AT HOUR 5"</text>

  <!-- ======================================================== -->
  <!-- 2. HAND-DRAWN CONNECTING BACKBONE & ANIMATED STREAM      -->
  <!-- ======================================================== -->
  <!-- Graphite Connecting Line with Hand-drawn Arcs -->
  <path d="M 60 92 C 160 88, 220 94, 320 90 C 420 86, 500 94, 600 90 C 700 86, 800 94, 940 90" stroke="#CBD5E1" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Animated Blue Data Stream Track -->
  <path d="M 60 92 C 160 88, 220 94, 320 90 C 420 86, 500 94, 600 90 C 700 86, 800 94, 940 90" stroke="#0284C7" stroke-width="2.2" class="flow-stream" fill="none" stroke-linecap="round"/>

  <!-- ======================================================== -->
  <!-- 3. MINI WIMPY KID RUNNER TRAVERSING THE PIPELINE         -->
  <!-- ======================================================== -->
  <g class="pipeline-runner" transform="translate(0, 0)">
    <g class="runner-bob" transform="translate(0, 68)">
      <!-- Ground Shadow -->
      <ellipse cx="0" cy="24" rx="10" ry="2" fill="#18181B" opacity="0.3"/>
      <!-- Trailing leg -->
      <path d="M -2 12 L -7 20 L -11 20" stroke="#18181B" stroke-width="2" fill="none"/>
      <!-- Driving front leg -->
      <path d="M 2 12 L 6 18 L 10 22" stroke="#18181B" stroke-width="2" fill="none"/>
      <!-- Torso -->
      <path d="M 0 3 L -1 13" stroke="#18181B" stroke-width="2.5"/>
      <!-- Pumping arms -->
      <path d="M -1 5 L -6 9 L -9 6" stroke="#18181B" stroke-width="1.8" fill="none"/>
      <path d="M 0 5 L 6 7 L 8 4" stroke="#18181B" stroke-width="1.8" fill="none"/>
      <!-- Round Head with 3 hairs & nose -->
      <circle cx="2" cy="-4" r="6" fill="#FFFFFF" stroke="#18181B" stroke-width="2"/>
      <path d="M 0 -10 L 0 -13 M 3 -10 L 4 -14 M 6 -9 L 8 -13" stroke="#18181B" stroke-width="1.5"/>
      <path d="M 8 -4 C 11 -4, 11 0, 7 0" stroke="#18181B" stroke-width="1.5" fill="#FFFFFF"/>
      <circle cx="5" cy="-5" r="1" fill="#18181B"/>
      <!-- Tiny sweat drop -->
      <path d="M -6 -7 Q -9 -7, -7 -4 Z" fill="#0284C7"/>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- 4. THE 6 SPRINT GATES (HAND-DRAWN NOTEBOOK CARDS)        -->
  <!-- ======================================================== -->

  <!-- GATE 1: DISCOVER -->
  <g class="gate-card" transform="translate(56, 52)">
    <rect x="0" y="0" width="134" height="82" rx="6" fill="#F0F9FF" stroke="#18181B" stroke-width="2.2" filter="url(#box-shadow)"/>
    <rect x="0" y="0" width="134" height="6" rx="2" fill="#0284C7"/>
    <text x="10" y="22" class="mono-code" font-size="11" fill="#0369A1">01. DISCOVER</text>
    <text x="10" y="36" class="mono-code" font-size="8.5" fill="#64748B">[EST: 60 min]</text>
    <path d="M 8 44 L 126 44" stroke="#BAE6FD" stroke-width="1"/>
    <text x="10" y="56" class="comic-hand" font-size="8.5" fill="#18181B">• &gt;= 15 Deep Qs</text>
    <text x="10" y="68" class="comic-hand" font-size="8.5" fill="#18181B">• Stitch &amp; ERD Tree</text>
  </g>

  <!-- GATE 2: BACKEND -->
  <g class="gate-card" transform="translate(208, 52)" style="animation-delay: 0.2s;">
    <rect x="0" y="0" width="134" height="82" rx="6" fill="#F5F3FF" stroke="#18181B" stroke-width="2.2" filter="url(#box-shadow)"/>
    <rect x="0" y="0" width="134" height="6" rx="2" fill="#7C3AED"/>
    <text x="10" y="22" class="mono-code" font-size="11" fill="#6D28D9">02. BACKEND</text>
    <text x="10" y="36" class="mono-code" font-size="8.5" fill="#64748B">[EST: 60 min]</text>
    <path d="M 8 44 L 126 44" stroke="#DDD6FE" stroke-width="1"/>
    <text x="10" y="56" class="comic-hand" font-size="8.5" fill="#18181B">• FastAPI + Pydantic</text>
    <text x="10" y="68" class="comic-hand" font-size="8.5" fill="#18181B">• Gemini &amp; SQLite</text>
  </g>

  <!-- GATE 3: FRONTEND -->
  <g class="gate-card" transform="translate(360, 52)" style="animation-delay: 0.4s;">
    <rect x="0" y="0" width="134" height="82" rx="6" fill="#FDF2F8" stroke="#18181B" stroke-width="2.2" filter="url(#box-shadow)"/>
    <rect x="0" y="0" width="134" height="6" rx="2" fill="#DB2777"/>
    <text x="10" y="22" class="mono-code" font-size="11" fill="#BE185D">03. FRONTEND</text>
    <text x="10" y="36" class="mono-code" font-size="8.5" fill="#64748B">[EST: 60 min]</text>
    <path d="M 8 44 L 126 44" stroke="#FBCFE8" stroke-width="1"/>
    <text x="10" y="56" class="comic-hand" font-size="8.5" fill="#18181B">• Live Swarm Coding</text>
    <text x="10" y="68" class="comic-hand" font-size="8.5" fill="#18181B">• Browser Verifier</text>
  </g>

  <!-- GATE 4: POLISH -->
  <g class="gate-card" transform="translate(512, 52)" style="animation-delay: 0.6s;">
    <rect x="0" y="0" width="134" height="82" rx="6" fill="#FFFBEB" stroke="#18181B" stroke-width="2.2" filter="url(#box-shadow)"/>
    <rect x="0" y="0" width="134" height="6" rx="2" fill="#D97706"/>
    <text x="10" y="22" class="mono-code" font-size="11" fill="#B45309">04. POLISH</text>
    <text x="10" y="36" class="mono-code" font-size="8.5" fill="#64748B">[EST: 45 min]</text>
    <path d="M 8 44 L 126 44" stroke="#FDE68A" stroke-width="1"/>
    <text x="10" y="56" class="comic-hand" font-size="8.5" fill="#18181B">• Anti-Slop (Impeccable)</text>
    <text x="10" y="68" class="comic-hand" font-size="8.5" fill="#18181B">• Code-Simplify (Addy)</text>
  </g>

  <!-- GATE 5: AUDIT -->
  <g class="gate-card" transform="translate(664, 52)" style="animation-delay: 0.8s;">
    <rect x="0" y="0" width="134" height="82" rx="6" fill="#FEF2F2" stroke="#18181B" stroke-width="2.2" filter="url(#box-shadow)"/>
    <rect x="0" y="0" width="134" height="6" rx="2" fill="#DC2626"/>
    <text x="10" y="22" class="mono-code" font-size="11" fill="#B91C1C">05. AUDIT</text>
    <text x="10" y="36" class="mono-code" font-size="8.5" fill="#64748B">[EST: 45 min]</text>
    <path d="M 8 44 L 126 44" stroke="#FECACA" stroke-width="1"/>
    <text x="10" y="56" class="comic-hand" font-size="8.5" fill="#18181B">• Gravitas &amp; Exit 0</text>
    <text x="10" y="68" class="comic-hand" font-size="8.5" fill="#18181B">• AAS Elite &amp; Ponytail</text>
  </g>

  <!-- GATE 6: LAUNCH -->
  <g class="gate-card" transform="translate(816, 52)" style="animation-delay: 1.0s;">
    <rect x="0" y="0" width="144" height="82" rx="6" fill="#ECFDF5" stroke="#18181B" stroke-width="2.2" filter="url(#box-shadow)"/>
    <rect x="0" y="0" width="144" height="6" rx="2" fill="#059669"/>
    <text x="10" y="22" class="mono-code" font-size="11" fill="#047857">06. LAUNCH</text>
    <text x="10" y="36" class="mono-code" font-size="8.5" fill="#64748B">[EST: 30 min]</text>
    <path d="M 8 44 L 136 44" stroke="#A7F3D0" stroke-width="1"/>
    <text x="10" y="56" class="comic-hand" font-size="8.5" fill="#18181B">• 60s Video (Brag/Remotion)</text>
    <text x="10" y="68" class="comic-hand" font-size="8.5" fill="#18181B">• Live URL &amp; Winning Pitch</text>
  </g>

</svg>
