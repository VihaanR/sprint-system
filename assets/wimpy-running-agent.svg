<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <style>
      @keyframes run-bob {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-7px) rotate(-1.5deg); }
      }
      @keyframes sweat-drop {
        0% { opacity: 0; transform: translate(0, 0) scale(0.5); }
        40% { opacity: 1; transform: translate(-10px, -8px) scale(1); }
        100% { opacity: 0; transform: translate(-25px, 6px) scale(0.3); }
      }
      @keyframes speed-pulse {
        0%, 100% { opacity: 0.3; stroke-dashoffset: 0; }
        50% { opacity: 0.9; stroke-dashoffset: -12; }
      }
      @keyframes clock-tick {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes float-bubble {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }

      .agent-runner { animation: run-bob 0.55s ease-in-out infinite; transform-origin: 320px 140px; }
      .sweat1 { animation: sweat-drop 0.9s ease-out infinite; }
      .sweat2 { animation: sweat-drop 0.9s 0.35s ease-out infinite; }
      .sweat3 { animation: sweat-drop 0.9s 0.65s ease-out infinite; }
      .speedline { stroke-dasharray: 8 6; animation: speed-pulse 0.7s linear infinite; }
      .clock-hand { animation: clock-tick 4s linear infinite; transform-origin: 575px 82px; }
      .speech-bubble { animation: float-bubble 2.2s ease-in-out infinite; }

      .hand-font { font-family: 'Comic Sans MS', 'Chalkboard SE', 'Bradley Hand', 'Segoe Print', cursive, sans-serif; font-weight: 700; }
      .mono-font { font-family: 'JetBrains Mono', 'Courier New', monospace; font-weight: 700; }
      .ink-stroke { stroke: #F8FAFC; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .ink-thin { stroke: #CBD5E1; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .accent-blue { stroke: #38BDF8; }
      .accent-amber { stroke: #F59E0B; }
      .accent-rose { stroke: #F43F5E; }
    </style>

    <!-- Notebook Grid / Lined Paper Background -->
    <pattern id="notebook-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="20" y2="20" stroke="#1E293B" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Notebook Container -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="#0B0F19" stroke="#334155" stroke-width="2"/>
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#notebook-grid)"/>

  <!-- Red Margin Line (Notebook Margin) -->
  <line x1="85" y1="2" x2="85" y2="238" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.65"/>

  <!-- Left Side Doodle: "DAY 1 OF SPRINT" binder clip & scribbles -->
  <g transform="translate(18, 24)">
    <path d="M 12 12 Q 18 6, 26 12 Q 34 20, 26 28 Q 16 34, 10 24 Z" stroke="#94A3B8" stroke-width="2.5" fill="none"/>
    <text x="28" y="110" transform="rotate(-90 28, 110)" class="mono-font" font-size="10" fill="#64748B" letter-spacing="3">ENTRY #01: THE 5-HOUR RUN</text>
  </g>

  <!-- Animated Speed Motion Lines Behind the Running Agent -->
  <g class="speedline" stroke="#38BDF8" stroke-width="2.5">
    <path d="M 110 135 Q 160 132, 210 135"/>
    <path d="M 95 155 Q 155 152, 215 155"/>
    <path d="M 120 175 Q 170 174, 225 178"/>
    <path d="M 105 195 Q 165 192, 220 196"/>
  </g>

  <!-- Ground Scribble Line (Wimpy Kid hand-drawn ground) -->
  <path d="M 120 205 Q 180 203, 240 206 Q 300 208, 360 204 Q 420 206, 480 204 Q 540 207, 600 204 Q 660 205, 720 203 Q 780 206, 850 204" class="ink-stroke" stroke="#475569" stroke-width="2"/>

  <!-- RUNNING WIMPY KID AGENT (Character Group) -->
  <g class="agent-runner" transform="translate(10, 0)">

    <!-- Shadow under feet -->
    <ellipse cx="270" cy="204" rx="38" ry="5" fill="#000000" opacity="0.45"/>

    <!-- Left Leg (Trailing leg, kicking back) -->
    <path d="M 270 152 Q 245 162, 225 174 Q 215 180, 205 176" class="ink-stroke" stroke="#F8FAFC" stroke-width="3.5"/>
    <!-- Left Shoe (Wimpy Kid oval cartoon sneaker) -->
    <path d="M 205 176 C 195 173, 185 182, 192 188 C 200 193, 216 186, 218 180 Z" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="2"/>
    <path d="M 194 186 L 202 186" stroke="#0F172A" stroke-width="1.5"/>

    <!-- Torso / Shirt (Angled forward in full sprint) -->
    <path d="M 285 106 L 268 154" class="ink-stroke" stroke="#F8FAFC" stroke-width="4"/>

    <!-- Right Leg (Forward driving knee) -->
    <path d="M 268 152 Q 288 166, 305 170 L 312 196" class="ink-stroke" stroke="#F8FAFC" stroke-width="3.5"/>
    <!-- Right Shoe (Front foot landing) -->
    <path d="M 312 196 C 314 204, 328 206, 335 200 C 340 195, 332 190, 322 192 Z" fill="#F8FAFC" stroke="#F8FAFC" stroke-width="2"/>
    <path d="M 320 199 L 330 198" stroke="#0F172A" stroke-width="1.5"/>

    <!-- Left Arm (Pumping backward holding coffee) -->
    <path d="M 280 114 Q 252 118, 238 108 L 228 116" class="ink-stroke" stroke="#F8FAFC" stroke-width="3"/>
    <!-- Spilling Coffee Cup -->
    <g transform="translate(216, 102) rotate(-20)">
      <path d="M 0 0 L 14 0 L 11 18 L 3 18 Z" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
      <path d="M 14 4 Q 20 8, 12 13" stroke="#F59E0B" stroke-width="1.5" fill="none"/>
      <!-- Spilling droplets -->
      <circle cx="-4" cy="-3" r="2" fill="#F59E0B"/>
      <circle cx="-10" cy="2" r="1.5" fill="#F59E0B"/>
    </g>

    <!-- Right Arm (Thrust forward clutching LAPTOP) -->
    <path d="M 282 114 Q 306 118, 326 110" class="ink-stroke" stroke="#F8FAFC" stroke-width="3.2"/>

    <!-- Laptop (Open in mid-air, emitting code) -->
    <g transform="translate(322, 90) rotate(12)">
      <!-- Laptop Base -->
      <polygon points="0,22 34,22 30,28 -4,28" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
      <!-- Laptop Screen -->
      <polygon points="4,2 34,4 32,22 2,20" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
      <!-- Screen glow / code line -->
      <line x1="8" y1="8" x2="28" y2="9" stroke="#38BDF8" stroke-width="1.5"/>
      <line x1="8" y1="13" x2="22" y2="14" stroke="#10B981" stroke-width="1.5"/>
      <!-- Flying code sparks -->
      <text x="36" y="2" class="mono-font" font-size="9" fill="#10B981">&lt;/&gt;</text>
      <text x="38" y="16" class="mono-font" font-size="8" fill="#38BDF8">01</text>
    </g>

    <!-- HEAD (Classic Wimpy Kid round head with big nose) -->
    <circle cx="290" cy="88" r="19" fill="#0B0F19" stroke="#F8FAFC" stroke-width="3.5"/>
    <!-- Iconic 3 Hair Strands on top of head -->
    <path d="M 285 69 Q 284 60, 281 54" class="ink-stroke" stroke-width="2.5"/>
    <path d="M 290 69 Q 292 58, 292 51" class="ink-stroke" stroke-width="2.5"/>
    <path d="M 296 70 Q 302 61, 305 55" class="ink-stroke" stroke-width="2.5"/>

    <!-- Eyes (Wide, frantic sprint expression) -->
    <circle cx="296" cy="84" r="3.2" fill="#F8FAFC"/>
    <circle cx="297" cy="84" r="1.5" fill="#0B0F19"/>
    <circle cx="305" cy="85" r="3.2" fill="#F8FAFC"/>
    <circle cx="306" cy="85" r="1.5" fill="#0B0F19"/>

    <!-- Wimpy Kid Big Round Nose -->
    <path d="M 307 88 Q 318 90, 312 96 Q 306 98, 302 94" class="ink-stroke" stroke-width="2.5"/>

    <!-- Determined / Panting Mouth -->
    <path d="M 298 98 Q 305 106, 310 99 Z" fill="#F43F5E" stroke="#F8FAFC" stroke-width="2"/>

    <!-- Flying Sweat Drops (Animated) -->
    <g class="sweat1">
      <path d="M 276 74 Q 270 68, 267 76 Q 272 80, 276 74 Z" fill="#38BDF8"/>
    </g>
    <g class="sweat2">
      <path d="M 272 88 Q 264 82, 260 90 Q 266 94, 272 88 Z" fill="#38BDF8"/>
    </g>
    <g class="sweat3">
      <path d="M 279 60 Q 274 54, 270 62 Q 276 66, 279 60 Z" fill="#38BDF8"/>
    </g>
  </g>

  <!-- TICKING STOPWATCH / COUNTDOWN GAUGE -->
  <g transform="translate(490, 48)">
    <!-- Watch Body -->
    <circle cx="85" cy="42" r="34" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="85" cy="42" r="30" fill="none" stroke="#334155" stroke-width="1.5"/>
    <!-- Top button / ring -->
    <rect x="80" y="2" width="10" height="7" rx="2" fill="#F59E0B"/>
    <circle cx="85" cy="3" r="6" fill="none" stroke="#F59E0B" stroke-width="2"/>
    <!-- Clock ticks -->
    <line x1="85" y1="16" x2="85" y2="21" stroke="#F8FAFC" stroke-width="2"/>
    <line x1="85" y1="63" x2="85" y2="68" stroke="#F8FAFC" stroke-width="2"/>
    <line x1="59" y1="42" x2="64" y2="42" stroke="#F8FAFC" stroke-width="2"/>
    <line x1="106" y1="42" x2="111" y2="42" stroke="#F8FAFC" stroke-width="2"/>
    <!-- Rotating Hand -->
    <g id="stopwatch-needle" class="clock-hand">
      <line x1="85" y1="42" x2="85" y2="24" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="85" cy="42" r="3" fill="#F43F5E"/>
    </g>
    <!-- Digital Time Below -->
    <text x="85" y="94" text-anchor="middle" class="mono-font" font-size="12" fill="#F59E0B">04:59:59</text>
    <text x="85" y="106" text-anchor="middle" class="mono-font" font-size="8.5" fill="#94A3B8">BUDGET TICKING</text>
  </g>

  <!-- HAND-DRAWN DOODLE SPEECH BUBBLE -->
  <g class="speech-bubble" transform="translate(580, 24)">
    <!-- Comic Speech Bubble Body with hand-drawn rough curve -->
    <path d="M 30 18 Q 80 10, 160 12 Q 240 10, 280 20 Q 300 45, 295 72 Q 285 96, 220 98 Q 140 102, 60 96 Q 20 94, 25 60 Q 22 36, 30 18 Z" 
          fill="#1E293B" stroke="#F8FAFC" stroke-width="2.5"/>
    <!-- Bubble Pointer to character -->
    <path d="M 45 92 L 0 115 L 60 96 Z" fill="#1E293B" stroke="#F8FAFC" stroke-width="2.5"/>
    <path d="M 43 90 L 62 94" stroke="#1E293B" stroke-width="4"/> <!-- clean up pointer seam -->

    <!-- Text inside Bubble (Diary handwritten style) -->
    <text x="160" y="40" text-anchor="middle" class="hand-font" font-size="14" fill="#F8FAFC">"IF THIS DEMO CRASHES</text>
    <text x="160" y="59" text-anchor="middle" class="hand-font" font-size="14" fill="#F8FAFC">DURING JUDGING...</text>
    <text x="160" y="80" text-anchor="middle" class="mono-font" font-size="13" fill="#F43F5E">I AM COOKED."</text>
  </g>

  <!-- Scribbled Diary Note in bottom right corner -->
  <g transform="translate(640, 155)">
    <rect x="0" y="0" width="220" height="58" rx="8" fill="#1C1917" stroke="#F59E0B" stroke-width="1.2" stroke-dasharray="4 3"/>
    <text x="12" y="19" class="mono-font" font-size="9" fill="#F59E0B">[RULE #1: DON'T PANIC]</text>
    <text x="12" y="34" class="hand-font" font-size="10.5" fill="#E2E8F0">Run 6 gated phases.</text>
    <text x="12" y="48" class="hand-font" font-size="10.5" fill="#38BDF8">Answer all 15 questions.</text>
  </g>
</svg>
