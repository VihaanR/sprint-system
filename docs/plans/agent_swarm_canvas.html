<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    .dot-grid {
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .agent-cursor {
      transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }
    .selection-box {
      border: 1.5px dashed var(--primary);
      box-shadow: 0 0 0 1px rgba(var(--primary), 0.2);
      transition: all 0.35s ease-out;
      pointer-events: none;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pulse-glow {
      animation: pulse-ring 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-2">
  <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-3 shadow-md overflow-hidden max-w-full">
    <!-- Header Controls -->
    <div class="flex items-center justify-between pb-2 mb-2 border-b border-[var(--border)] flex-wrap gap-2">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <span class="font-bold text-sm tracking-tight text-[var(--foreground)]">Antigravity Swarm Live Canvas</span>
        <span class="text-xs px-2 py-0.5 rounded-full bg-[var(--primary)] text-[var(--primary-foreground)] font-mono font-medium">pen.dev style</span>
      </div>
      <div class="flex items-center gap-1.5">
        <select id="presetSelect" class="text-xs bg-[var(--background)] border border-[var(--border)] text-[var(--foreground)] rounded px-2 py-1 outline-none">
          <option value="saas">Preset: SaaS Hero</option>
          <option value="card">Preset: Glass Card</option>
          <option value="dashboard">Preset: Analytics Pod</option>
        </select>
        <button id="playBtn" class="text-xs bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 font-medium px-2.5 py-1 rounded transition">▶ Replay Swarm</button>
      </div>
    </div>

    <!-- Active Agents Indicator Bar -->
    <div class="flex items-center gap-2 mb-2 px-1 text-xs text-[var(--muted-foreground)] flex-wrap">
      <span class="font-medium text-[var(--foreground)]">Swarm Agents:</span>
      <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-purple-500/10 text-purple-400 font-mono text-[11px] border border-purple-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-purple-500"></span> Agent Orion (Layout)
      </span>
      <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-emerald-500/10 text-emerald-400 font-mono text-[11px] border border-emerald-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Agent Lyra (Styling)
      </span>
      <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-amber-500/10 text-amber-400 font-mono text-[11px] border border-amber-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span> Agent Echo (Logic)
      </span>
      <span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded bg-sky-500/10 text-sky-400 font-mono text-[11px] border border-sky-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-sky-500"></span> Agent Nova (A11y QA)
      </span>
    </div>

    <!-- Canvas Workspace -->
    <div id="canvasContainer" class="relative dot-grid bg-[var(--background)] border border-[var(--border)] rounded-lg min-h-[300px] h-[310px] w-full overflow-hidden flex items-center justify-center p-4">
      
      <!-- Selection Bounding Box Overlay -->
      <div id="selectionBox" class="selection-box absolute hidden rounded pointer-events-none z-20">
        <div class="absolute -top-1.5 -left-1.5 w-3 h-3 bg-[var(--primary)] rounded-sm"></div>
        <div class="absolute -top-1.5 -right-1.5 w-3 h-3 bg-[var(--primary)] rounded-sm"></div>
        <div class="absolute -bottom-1.5 -left-1.5 w-3 h-3 bg-[var(--primary)] rounded-sm"></div>
        <div class="absolute -bottom-1.5 -right-1.5 w-3 h-3 bg-[var(--primary)] rounded-sm"></div>
      </div>

      <!-- Live Generated Component Under Construction -->
      <div id="targetStage" class="relative z-10 w-full max-w-md transition-all duration-300">
        <!-- Rendered dynamically by swarm steps -->
      </div>

      <!-- Cursor 1: Orion (Purple) -->
      <div id="cursorOrion" class="agent-cursor absolute z-30 flex flex-col items-start" style="top: 20px; left: 30px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="drop-shadow-md">
          <path d="M4 3L20 11L12.5 13.5L9.5 21L4 3Z" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <div class="bg-purple-600 text-white text-[11px] font-semibold px-1.5 py-0.5 rounded-md shadow-md ml-3 -mt-1 flex items-center gap-1 whitespace-nowrap">
          <span>Orion</span>
          <span id="badgeOrion" class="opacity-75 font-normal">idle</span>
        </div>
      </div>

      <!-- Cursor 2: Lyra (Emerald) -->
      <div id="cursorLyra" class="agent-cursor absolute z-30 flex flex-col items-start" style="top: 40px; right: 40px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="drop-shadow-md">
          <path d="M4 3L20 11L12.5 13.5L9.5 21L4 3Z" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <div class="bg-emerald-600 text-white text-[11px] font-semibold px-1.5 py-0.5 rounded-md shadow-md ml-3 -mt-1 flex items-center gap-1 whitespace-nowrap">
          <span>Lyra</span>
          <span id="badgeLyra" class="opacity-75 font-normal">idle</span>
        </div>
      </div>

      <!-- Cursor 3: Echo (Amber) -->
      <div id="cursorEcho" class="agent-cursor absolute z-30 flex flex-col items-start" style="bottom: 30px; left: 60px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="drop-shadow-md">
          <path d="M4 3L20 11L12.5 13.5L9.5 21L4 3Z" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <div class="bg-amber-600 text-white text-[11px] font-semibold px-1.5 py-0.5 rounded-md shadow-md ml-3 -mt-1 flex items-center gap-1 whitespace-nowrap">
          <span>Echo</span>
          <span id="badgeEcho" class="opacity-75 font-normal">idle</span>
        </div>
      </div>

      <!-- Cursor 4: Nova (Sky Blue) -->
      <div id="cursorNova" class="agent-cursor absolute z-30 flex flex-col items-start" style="bottom: 40px; right: 50px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="drop-shadow-md">
          <path d="M4 3L20 11L12.5 13.5L9.5 21L4 3Z" fill="#0EA5E9" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
        </svg>
        <div class="bg-sky-600 text-white text-[11px] font-semibold px-1.5 py-0.5 rounded-md shadow-md ml-3 -mt-1 flex items-center gap-1 whitespace-nowrap">
          <span>Nova</span>
          <span id="badgeNova" class="opacity-75 font-normal">idle</span>
        </div>
      </div>
    </div>

    <!-- Live Telemetry Stream -->
    <div class="mt-2 pt-2 border-t border-[var(--border)] flex items-center justify-between text-xs text-[var(--muted-foreground)]">
      <div id="swarmStatus" class="font-mono text-xs truncate max-w-[80%]">
        ⚡ Initializing Agent Swarm session...
      </div>
      <div id="stepCounter" class="font-mono text-xs font-semibold text-[var(--foreground)]">
        Step: 0/6
      </div>
    </div>
  </div>

  <script>
    const stage = document.getElementById('targetStage');
    const box = document.getElementById('selectionBox');
    const status = document.getElementById('swarmStatus');
    const stepCounter = document.getElementById('stepCounter');

    const orion = document.getElementById('cursorOrion');
    const lyra = document.getElementById('cursorLyra');
    const echo = document.getElementById('cursorEcho');
    const nova = document.getElementById('cursorNova');

    const bOrion = document.getElementById('badgeOrion');
    const bLyra = document.getElementById('badgeLyra');
    const bEcho = document.getElementById('badgeEcho');
    const bNova = document.getElementById('badgeNova');

    let currentStep = 0;
    let timer = null;

    function moveCursor(el, badgeEl, x, y, actionText) {
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      badgeEl.textContent = actionText;
    }

    function selectArea(x, y, w, h) {
      box.style.display = 'block';
      box.style.left = x + 'px';
      box.style.top = y + 'px';
      box.style.width = w + 'px';
      box.style.height = h + 'px';
    }

    function hideSelection() {
      box.style.display = 'none';
    }

    const steps = [
      // Step 1: Orion drafts layout skeleton
      () => {
        status.textContent = "🟣 Orion: Calculating layout container & flex hierarchy";
        stepCounter.textContent = "Step: 1/6";
        moveCursor(orion, bOrion, 160, 60, "drafting box");
        moveCursor(lyra, bLyra, 380, 80, "awaiting tokens");
        moveCursor(echo, bEcho, 120, 220, "planning state");
        moveCursor(nova, bNova, 420, 220, "scanning a11y");

        stage.innerHTML = `
          <div id="cBox" class="border border-dashed border-purple-500/50 bg-[var(--card)]/40 rounded-xl p-4 transition-all">
            <div class="h-4 w-24 bg-purple-500/20 rounded mb-2"></div>
            <div class="h-6 w-3/4 bg-purple-500/20 rounded mb-2"></div>
            <div class="h-8 w-32 bg-purple-500/20 rounded"></div>
          </div>
        `;
        selectArea(140, 70, 320, 140);
      },

      // Step 2: Lyra applies design tokens (Glassmorphic theme)
      () => {
        status.textContent = "🟢 Lyra: Injecting UI/UX Pro Max OLED Dark tokens & gradients";
        stepCounter.textContent = "Step: 2/6";
        moveCursor(orion, bOrion, 320, 110, "snapping grid");
        moveCursor(lyra, bLyra, 210, 80, "styling border & bg");
        moveCursor(echo, bEcho, 260, 180, "binding state");
        moveCursor(nova, bNova, 390, 160, "contrast check 7:1");

        stage.innerHTML = `
          <div id="cBox" class="border border-[var(--border)] bg-[var(--card)] shadow-lg rounded-xl p-4 transition-all relative overflow-hidden backdrop-blur-md">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-400">PRO FEATURE</span>
              <span class="text-xs text-[var(--muted-foreground)] font-mono">v2.4</span>
            </div>
            <h3 class="text-base font-bold text-[var(--foreground)] mb-1">Autonomous Agent Swarm</h3>
            <p class="text-xs text-[var(--muted-foreground)] mb-3">Multi-cursor live code generation running in parallel.</p>
            <div class="flex items-center gap-2">
              <div class="h-7 w-28 bg-[var(--primary)] rounded text-[var(--primary-foreground)] text-xs flex items-center justify-center font-medium opacity-60">Wiring CTA...</div>
            </div>
          </div>
        `;
        selectArea(150, 75, 330, 150);
      },

      // Step 3: Echo wires interactive click handler & counter
      () => {
        status.textContent = "🟠 Echo: Attaching interactive counter & soundless ripple";
        stepCounter.textContent = "Step: 3/6";
        moveCursor(orion, bOrion, 130, 150, "verified layout");
        moveCursor(lyra, bLyra, 360, 120, "polish transitions");
        moveCursor(echo, bEcho, 200, 165, "injecting onClick()");
        moveCursor(nova, bNova, 290, 175, "verifying focus ring");

        stage.innerHTML = `
          <div id="cBox" class="border border-[var(--border)] bg-[var(--card)] shadow-xl rounded-xl p-4 transition-all relative">
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400">LIVE COMPILED</span>
              <span class="text-xs text-[var(--muted-foreground)] font-mono">⚡ 120fps</span>
            </div>
            <h3 class="text-base font-bold text-[var(--foreground)] mb-1">Autonomous Agent Swarm</h3>
            <p class="text-xs text-[var(--muted-foreground)] mb-3">Multi-cursor live code generation running in parallel.</p>
            <div class="flex items-center gap-2">
              <button id="swarmDemoBtn" onclick="incrementCounter()" class="px-3 py-1.5 bg-[var(--primary)] text-[var(--primary-foreground)] text-xs font-semibold rounded-lg hover:opacity-90 active:scale-95 transition shadow cursor-pointer flex items-center gap-1.5">
                <span>⚡ Pulse Clicks:</span> <span id="countVal" class="font-bold underline">0</span>
              </button>
              <span class="text-[11px] text-[var(--muted-foreground)]">(Click me!)</span>
            </div>
          </div>
        `;
        selectArea(160, 160, 180, 45);
      },

      // Step 4: Nova audits accessibility & focus rings
      () => {
        status.textContent = "🔵 Nova: Validating keyboard trap, aria-labels, and touch target (48px)";
        stepCounter.textContent = "Step: 4/6";
        moveCursor(orion, bOrion, 80, 200, "idle");
        moveCursor(lyra, bLyra, 410, 90, "idle");
        moveCursor(echo, bEcho, 170, 210, "tested onClick");
        moveCursor(nova, bNova, 240, 160, "WCAG AAA Pass ✓");

        selectArea(140, 65, 340, 165);
      },

      // Step 5: Swarm Celebration / Idle Orbit
      () => {
        status.textContent = "✨ Swarm Complete: Production component verified & mounted live!";
        stepCounter.textContent = "Step: 5/6";
        hideSelection();
        moveCursor(orion, bOrion, 40, 40, "Done ✓");
        moveCursor(lyra, bLyra, 440, 40, "Done ✓");
        moveCursor(echo, bEcho, 50, 240, "Done ✓");
        moveCursor(nova, bNova, 430, 240, "Done ✓");
      }
    ];

    window.incrementCounter = function() {
      const c = document.getElementById('countVal');
      if (c) c.textContent = parseInt(c.textContent || '0') + 1;
    };

    function runSwarm() {
      currentStep = 0;
      clearInterval(timer);
      steps[0]();
      timer = setInterval(() => {
        currentStep++;
        if (currentStep < steps.length) {
          steps[currentStep]();
        } else {
          clearInterval(timer);
        }
      }, 1600);
    }

    document.getElementById('playBtn').addEventListener('click', runSwarm);
    // Start automatically
    runSwarm();
  </script>
</body>
</html>
